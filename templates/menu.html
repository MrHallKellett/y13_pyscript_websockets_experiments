<!DOCTYPE html>
<html lang="en">
<head>
    <title>Math Quiz - Menu</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="static/styles.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2022.12.1/pyscript.css" />
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.3/core.css">
      <script type="module" src="https://pyscript.net/releases/2024.1.3/core.js"></script>
</head>

<body>
    <main>
        <h1>Math Quiz</h1>

        <div class="grid">

            <div class="column">
                <label for="username">Set username:
                    <input name="username" id="username" type="text"/>    
                </label>
                <br>
                <label for="available_games">Join existing game:
                    <select name="available_games" id="available_games"></select>
                </label>

                <a href="/game"><button id="join">Join</button></a>
            </div>

            <div class="column">
                    <h2>Create a new game:</h2>
    
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                        <br>

                        <label for="max_players">Maximum Players:</label>
                        <input type="number" id="max_players" name="max_players" min="2" required>
                        <br>

                        <label for="delay">Number of Seconds Before Game Starts:</label>
                        <input type="number" id="delay" name="delay" min="0" required>
                        <br>
                        <label for="num_questions">Number of Questions:</label>
                        <input type="number" id="num_questions" name="num_questions" min="10" required>
                        <br>
                        <button id="create_game">Create Game</button>
                    </label>
        
            </div>
        
        </div>

        
        <div id="feedback" style="color:red;">
        
        <ul id="flashes">
            {% with messages = get_flashed_messages() %}           
                    
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}               
                
            {% endwith %}
        </ul>
        
        
        </div>




    <py-script src="static/menu.py"></py-script>
    <py-script src="static/app.py"></py-script>
    





</main>
</body>
</html>
