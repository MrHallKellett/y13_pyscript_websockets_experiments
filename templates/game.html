<!DOCTYPE html>
<html lang="en">
<head>
    <title>Math Quiz - Game</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="https://pyscript.net/releases/2022.12.1/pyscript.css" />
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.3/core.css">
      <script type="module" src="https://pyscript.net/releases/2024.1.3/core.js"></script>

    
    <py-script>
game_id = {{game_id}}
mode = "game"
    </py-script>
    


</head>
<body>
    <main>
        <h1>Math Quiz</h1>
        

        <div id="countdown" style="font-size:72px; width:500px; height:500px"></div>

        <div id="container" style="display:none; width:1000px; height:1000px"></div>

        
        <div id="feedback" style="color:red;">
        
        <ul id="flashes">
            {% with messages = get_flashed_messages() %}           
                    
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}               
                
            {% endwith %}
        </ul>
        
        
        </div>




    <py-script src="static/game.py"></py-script>
    <py-script src="static/app.py"></py-script>
    


</main>
</body>
</html>
